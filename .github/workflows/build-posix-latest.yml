name: C/C++ CI on Linux and Mac

on:
  push:
    branches:
    - master
    - main
    - dev
    - dev/*
    - release/*
    - buildme/*
    - fix/*

  pull_request:
    branches:
    - master
    - main
    - dev

  schedule:
  - cron: 0 2 * * 1-5


# Least-privilege GITHUB_TOKEN scope: this workflow only checks out source
# and runs the Linux/Mac build matrix. Explicit block satisfies CodeQL rule
# actions/missing-workflow-permissions if Actions analysis is enabled.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:

    runs-on: ${{ matrix.os }}
    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    strategy:
      matrix:
        config: [release, debug]
        os: [ubuntu-latest, macOS-latest]
    
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - name: Initialize googletest
      run: git submodule update --init --depth=1 third_party/googletest
    - name: Test ${{ matrix.os }} ${{ matrix.config }}
      run: ./build-tests.sh ${{ matrix.config }}

  public-headers:
    name: Public header gate (GCC/Clang)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - name: Install clang
      run: sudo apt-get update && sudo apt-get install -y clang
    - name: Compile each public header standalone under strict flags
      run: bash tests/headers/check_public_headers.sh

  no-exceptions:
    name: Full SDK without C++ exceptions (${{ matrix.os }}, ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
        - os: ubuntu-latest
          compiler: gcc
          cc: gcc
          cxx: g++
        - os: ubuntu-latest
          compiler: clang
          cc: clang
          cxx: clang++
        - os: macos-latest
          compiler: appleclang
          cc: clang
          cxx: clang++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - name: Install build dependencies
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y clang libcurl4-openssl-dev libsqlite3-dev zlib1g-dev
    - name: Configure
      run: >-
        cmake -S . -B out-no-exceptions
        -DCMAKE_BUILD_TYPE=Debug
        -DCMAKE_CXX_FLAGS=-fno-exceptions
        -DMATSDK_BUILD_SWIFT_WRAPPER=OFF
        -DMATSDK_BUILD_UNIT_TESTS=OFF
        -DMATSDK_BUILD_FUNC_TESTS=OFF
        -DMATSDK_BUILD_TEST_TOOL=OFF
    - name: Compile full SDK
      run: >-
        cmake --build out-no-exceptions --target mat --parallel 2
    - name: Public headers and exception macro regression
      if: runner.os == 'macOS'
      run: bash tests/headers/check_public_headers.sh
