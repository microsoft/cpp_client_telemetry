name: C/C++ CI on Windows (vs2022)

on:
  push:
    branches:
    - master
    - main
    - dev
    - fix/*

  pull_request:
    branches:
    - master
    - main
    - dev

# Least-privilege GITHUB_TOKEN scope: this workflow only checks out source
# and runs the Visual Studio 2022 build. Explicit block satisfies CodeQL
# rule actions/missing-workflow-permissions if Actions analysis is enabled.
permissions:
  contents: read

jobs:
  no-exceptions:
    name: Windows without C++ exceptions (${{ matrix.compiler }}, WinInet=${{ matrix.wininet }})
    runs-on: windows-2022
    strategy:
      matrix:
        compiler: [msvc, clang-cl]
        wininet: [OFF, ON]
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - name: Configure full SDK
      shell: pwsh
      run: |
        $options = @(
          '-S', '.', '-B', 'out-no-exceptions', '-A', 'x64',
          '-DMATSDK_BUILD_UNIT_TESTS=OFF',
          '-DMATSDK_BUILD_FUNC_TESTS=OFF',
          '-DMATSDK_BUILD_TEST_TOOL=OFF',
          '-DMATSDK_BUILD_PACKAGE=OFF',
          '-DMATSDK_USE_WININET=${{ matrix.wininet }}'
        )
        $flags = '/DWIN32 /D_WINDOWS /EHs-c- /D_HAS_EXCEPTIONS=0'
        if ('${{ matrix.compiler }}' -eq 'clang-cl') {
          $options += @('-T', 'ClangCL')
          $flags += ' /clang:-fno-exceptions'
        }
        cmake @options "-DCMAKE_CXX_FLAGS=$flags"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Compile full SDK
      run: cmake --build out-no-exceptions --config Debug --target mat --parallel 2
    - name: Public headers and exception macro regression
      if: matrix.compiler == 'msvc' && matrix.wininet == 'OFF'
      shell: cmd
      run: tests\headers\check_public_headers.cmd

  build:

    runs-on: windows-2022
    name: Build

    steps:

    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Build
      env:
        SKIP_ARM_BUILD: 1
        SKIP_ARM64_BUILD: 1
        PlatformToolset: v143
        VSTOOLS_VERSION: vs2022
      shell: cmd
      run: build-all-windows.bat
