name: Vcpkg port tests

on:
  push:
    branches:
    - master
    - main
    - dev
    - dev/*
    - release/*
    - buildme/*

  pull_request:
    branches:
    - master
    - main
    - dev


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-packaging:
    runs-on: ${{ matrix.os }}
    name: Release packaging (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - name: Test release port promotion
      run: python tests/vcpkg/test-release-port.py
    - name: Verify native feature mappings
      run: cmake -P tests/vcpkg/native-feature-tests.cmake

  windows:
    runs-on: windows-latest
    name: Windows (x64-windows-static, ${{ matrix.transport }}, ${{ matrix.features }})
    strategy:
      fail-fast: false
      matrix:
        transport: [WinHTTP, WinInet]
        features: [default, "minimal-sqlite;no-exceptions;no-logging"]
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Bootstrap vcpkg
      run: |
        git clone https://github.com/microsoft/vcpkg.git ${{ runner.temp }}\vcpkg
        & "${{ runner.temp }}\vcpkg\bootstrap-vcpkg.bat" -disableMetrics
      shell: pwsh

    - name: Run vcpkg port test
      run: |
        $arguments = @{ VcpkgRoot = "${{ runner.temp }}\vcpkg" }
        if ("${{ matrix.transport }}" -eq "WinInet") {
          $arguments.WinInet = $true
        }
        if ("${{ matrix.features }}" -ne "default") {
          $arguments.Features = "${{ matrix.features }}".Split(';')
        }
        .\tests\vcpkg\test-vcpkg-windows.ps1 @arguments
      shell: pwsh

  linux:
    runs-on: ubuntu-latest
    name: Linux (x64-linux, ${{ matrix.features }})
    strategy:
      fail-fast: false
      matrix:
        features: [default, minimal-sqlite, "minimal-sqlite;no-exceptions;no-logging"]
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Bootstrap vcpkg
      run: |
        git clone https://github.com/microsoft/vcpkg.git "${{ runner.temp }}/vcpkg"
        "${{ runner.temp }}/vcpkg/bootstrap-vcpkg.sh" -disableMetrics

    - name: Run vcpkg port test
      env:
        VCPKG_ROOT: ${{ runner.temp }}/vcpkg
      run: |
        chmod +x tests/vcpkg/test-vcpkg-linux.sh
        ./tests/vcpkg/test-vcpkg-linux.sh "${{ matrix.features }}"

  macos:
    runs-on: macos-latest
    name: macOS (native)
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Bootstrap vcpkg
      run: |
        git clone https://github.com/microsoft/vcpkg.git "${{ runner.temp }}/vcpkg"
        "${{ runner.temp }}/vcpkg/bootstrap-vcpkg.sh" -disableMetrics

    - name: Run vcpkg port test
      env:
        VCPKG_ROOT: ${{ runner.temp }}/vcpkg
      run: |
        chmod +x tests/vcpkg/test-vcpkg-macos.sh
        ./tests/vcpkg/test-vcpkg-macos.sh

  ios:
    runs-on: macos-latest
    name: iOS (arm64-ios cross-compile)
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Bootstrap vcpkg
      run: |
        git clone https://github.com/microsoft/vcpkg.git "${{ runner.temp }}/vcpkg"
        "${{ runner.temp }}/vcpkg/bootstrap-vcpkg.sh" -disableMetrics

    - name: Run vcpkg port test (device)
      env:
        VCPKG_ROOT: ${{ runner.temp }}/vcpkg
      run: |
        chmod +x tests/vcpkg/test-vcpkg-ios.sh
        ./tests/vcpkg/test-vcpkg-ios.sh

  android:
    runs-on: ubuntu-latest
    name: Android (arm64-v8a API 23, ${{ matrix.features }})
    strategy:
      fail-fast: false
      matrix:
        features: [default, minimal-sqlite, "minimal-sqlite;android-curl-openssl", "minimal-sqlite;android-curl-mbedtls", "minimal-sqlite;no-exceptions;no-logging;android-capi-http-client"]
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Bootstrap vcpkg
      run: |
        git clone https://github.com/microsoft/vcpkg.git "${{ runner.temp }}/vcpkg"
        "${{ runner.temp }}/vcpkg/bootstrap-vcpkg.sh" -disableMetrics

    - name: Install Android test prerequisites
      run: sudo apt-get update && sudo apt-get install -y ninja-build

    - name: Run vcpkg port test
      env:
        VCPKG_ROOT: ${{ runner.temp }}/vcpkg
      run: |
        chmod +x tests/vcpkg/test-vcpkg-android.sh
        ./tests/vcpkg/test-vcpkg-android.sh arm64-v8a 23 "${{ matrix.features }}"
