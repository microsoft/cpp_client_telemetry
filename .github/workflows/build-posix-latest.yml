name: C/C++ CI on Linux and Mac

on:
  push:
    branches:
    - master
    - main
    - dev
    - dev/*
    - release/*
    - buildme/*

  pull_request:
    branches:
    - master
    - main
    - dev

  schedule:
  - cron: 0 2 * * 1-5


# Least-privilege GITHUB_TOKEN scope: this workflow only checks out source
# and runs the Linux/Mac build matrix. Explicit block satisfies CodeQL rule
# actions/missing-workflow-permissions if Actions analysis is enabled.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:

    runs-on: ${{ matrix.os }}
    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    strategy:
      matrix:
        config: [release, debug]
        os: [ubuntu-latest, macOS-latest]
    
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - name: Initialize googletest
      run: git submodule update --init --depth=1 third_party/googletest
    - name: Test ${{ matrix.os }} ${{ matrix.config }}
      run: ./build-tests.sh ${{ matrix.config }}

  device-id-optout:
    name: Device-ID opt-out (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macOS-latest, windows-2022]
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - name: Initialize googletest
      run: git submodule update --init --depth=1 third_party/googletest
    - name: Configure without native device-ID collection
      shell: pwsh
      run: |
        $options = @(
          "-S", ".", "-B", "out-device-id-off",
          "-DCMAKE_BUILD_TYPE=Debug",
          "-DMATSDK_ENABLE_DEVICE_ID=OFF",
          "-DMATSDK_BUILD_UNIT_TESTS=ON",
          "-DMATSDK_BUILD_FUNC_TESTS=OFF",
          "-DMATSDK_BUILD_TEST_TOOL=OFF",
          "-DMATSDK_BUILD_PACKAGE=OFF"
        )
        if ($env:RUNNER_OS -eq "Windows") {
          $options += "-DCMAKE_CXX_FLAGS_INIT=/EHsc"
        }
        cmake @options
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Build
      run: cmake --build out-device-id-off --config Debug --target UnitTests --parallel 2
    - name: Run affected and adjacent suites
      shell: pwsh
      run: |
        $binary = "out-device-id-off/tests/unittests/UnitTests"
        if ($env:RUNNER_OS -eq "Windows") {
          $binary = "out-device-id-off\tests\unittests\Debug\UnitTests.exe"
        }
        & $binary "--gtest_filter=DeviceIdTests.*:ContextFieldsProviderTests.*:BoundedInputTests.*:PalTests.*:SysInfoUtilsTests.*"
        exit $LASTEXITCODE
    - name: Verify vcpkg feature mapping
      run: cmake -P tests/vcpkg/device-id-feature-tests.cmake

  public-headers:
    name: Public header gate (GCC/Clang)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - name: Install clang
      run: sudo apt-get update && sudo apt-get install -y clang
    - name: Compile each public header standalone under strict flags
      run: bash tests/headers/check_public_headers.sh

  no-exceptions:
    name: Linux Curl without C++ exceptions
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - name: Install Curl development package
      run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
    - name: Configure
      run: >-
        cmake -S . -B out-no-exceptions
        -DCMAKE_BUILD_TYPE=Debug
        -DCMAKE_CXX_FLAGS=-fno-exceptions
        -DMATSDK_BUILD_UNIT_TESTS=OFF
        -DMATSDK_BUILD_FUNC_TESTS=OFF
        -DMATSDK_BUILD_TEST_TOOL=OFF
    - name: Compile Curl transport
      run: >-
        make -C out-no-exceptions
        -f lib/CMakeFiles/mat.dir/build.make
        lib/CMakeFiles/mat.dir/http/HttpClient_Curl.cpp.o
