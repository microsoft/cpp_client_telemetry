name: Build and Run Unit/Functional tests on Windows

on:
  push:
    branches:
    - master
    - main
    - dev
    - dev/*
    - release/*
    - buildme/*

  pull_request:
    branches:
    - master
    - main
    - dev

  schedule:
  - cron: 0 2 * * 1-5


# Least-privilege GITHUB_TOKEN scope: this workflow only checks out source
# and runs Windows unit/functional tests. Explicit block satisfies CodeQL
# rule actions/missing-workflow-permissions if Actions analysis is enabled.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test on Windows ${{ matrix.arch }}-${{ matrix.build }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        arch: [Win32]
        build: [Release]
        os: [windows-2022]
    
    steps:

    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      continue-on-error: true

    - name: setup-msbuild
      uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2.0.0
      with:
        vs-version: '[17,)'

    - name: Test ${{ matrix.arch }} ${{ matrix.build }}
      shell: cmd
      env:
        FUNCTESTS_WATCHDOG_SEC: '420'
      run: build-tests.cmd ${{ matrix.arch }} ${{ matrix.build }}

    - name: Upload FuncTests binaries for offline symbolization
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: functests-${{ matrix.arch }}-${{ matrix.build }}
        path: |
          Solutions/out/${{ matrix.build }}/${{ matrix.arch }}/FuncTests/FuncTests.exe
          Solutions/out/${{ matrix.build }}/${{ matrix.arch }}/FuncTests/FuncTests.pdb
        if-no-files-found: warn

  public-headers:
    name: Public header gate (MSVC)
    runs-on: windows-2022
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - name: Compile each public header standalone under /W4 /WX
      shell: cmd
      run: tests\headers\check_public_headers.cmd
