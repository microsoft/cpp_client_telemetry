name: Set up CMake
description: Install the repository's required CMake release.
runs:
  using: composite
  steps:
  - name: Install CMake 4.4.2
    shell: pwsh
    run: |
      python -m pip install --disable-pip-version-check --upgrade "cmake==4.4.2"
      $cmakeBin = python -c "import cmake; print(cmake.CMAKE_BIN_DIR)"
      $cmakeBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      & (Join-Path $cmakeBin "cmake") --version
